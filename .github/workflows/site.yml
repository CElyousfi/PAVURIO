# Rebuilds the website whenever it changes on main and publishes the result to the `site-dist`
# branch. Vercel (project `pavurio`) serves pavurio.com from that branch (no other host).
name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/site/**', 'tools/art/gifkit.py', 'docs/art/gifs/**', 'assets/art/**', 'assets/icon.png', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: site, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install markdown pillow numpy opencv-python-headless
      - run: python3 tools/site/build.py
      - name: Publish to site-dist
        run: |
          cd site/dist
          printf '# site-dist\n\nGenerated by tools/site/build.py from main (%s). Do not edit: served on pavurio.com by Vercel.\n' "${GITHUB_SHA::7}" > README.md
          git init -q -b site-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Website built from main ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site-dist
